name: ganit_safar
description: An offline bilingual mathematics adventure for Classes 1–4.
publish_to: none
version: 1.2.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  window_manager: ^0.5.1
  web: ^1.1.1
  crypto: ^3.0.6
  http: ^1.5.0
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
dev_dependencies:
  analyzer: 10.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/art/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
